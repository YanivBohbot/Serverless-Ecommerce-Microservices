name: Microservices Production CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'order-system/services/**' # ירוץ רק כשמשתנה קוד בשירותים

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            order-service: 'order-system/services/order-service/**'
            inventory-service: 'order-system/services/inventory-service/**'
            intelligence-service: 'order-system/services/intelligence-service/**'
            notification-service: 'order-system/services/notification-service/**'
            payment-service: 'order-system/services/payment-service/**'

  build-and-deploy:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # יבנה במקביל רק את השירותים שהשתנו
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          # כאן התיקון הקריטי של הנתיב
          docker build -t $ECR_REGISTRY/$SERVICE_NAME:${{ github.sha }} ./order-system/services/$SERVICE_NAME
          docker push $ECR_REGISTRY/$SERVICE_NAME:${{ github.sha }}
          docker tag $ECR_REGISTRY/$SERVICE_NAME:${{ github.sha }} $ECR_REGISTRY/$SERVICE_NAME:latest
          docker push $ECR_REGISTRY/$SERVICE_NAME:latest