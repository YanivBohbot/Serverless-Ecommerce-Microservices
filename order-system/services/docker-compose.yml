version: '3.8'

services:
  postgres-db:
    image: postgres:15
    container_name: order_service_db
    ports:
      - "5444:5432"
    environment:
      POSTGRES_USER: admin_yaniv
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: orders_final_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:           
      - app-network

  order-service:
    build: ./order-service
    container_name: order_service_app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      # חשוב: כאן אנחנו משתמשים בשם של ה-service בתוך הרשת של דוקר
      - DATABASE_URL=postgres://admin_yaniv:password123@postgres-db:5432/orders_final_db
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}         # הוספה: כדי שיוכל לשלוח ל-SNS
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY} # הוספה
    depends_on:
      - postgres-db
    networks:           
      - app-network

  inventory-service:
    build: ./inventory-service # וודא שבתוך התיקייה הזו יש קובץ בשם Dockerfile
    container_name: inventory_service_app
    ports:
      - "3002:3002"
    env_file:
      - ./inventory-service/.env
    environment:
      - PORT=3002
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}         # הוספה
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY} # הוספה
    networks:          
      - app-network

  notification_service:
    build: ./notification-service
    container_name: notification_service_app
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - NOTIFICATION_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/584246028688/notification-queue
    depends_on:
      - order-service
      - inventory-service
    networks:
      - app-network


  intelligence_service:
    build: ./intelligence-service
    container_name: intelligence_service_app
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DATABASE_URL=postgres://admin_yaniv:password123@postgres-db:5432/orders_final_db
    depends_on:
      - postgres-db
    networks:
      - app-network


  payment-service:
    build: ./payment-service
    container_name: payment_service_app
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - PAYMENT_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/584246028688/payment-queue
      - PAYMENT_TOPIC_ARN=arn:aws:sns:us-east-1:584246028688:payment-events-topic
      - DYNAMODB_TABLE=Payments
    depends_on:
      - order-service
    networks:
      - app-network

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app-network

  kibana:
    image: kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - app-network

  search-service:
    build: ./search-service
    container_name: search_service_app
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SEARCH_ORDER_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/584246028688/search-order-queue
      - SEARCH_INVENTORY_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/584246028688/search-inventory-queue
      - SEARCH_PAYMENT_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/584246028688/search-payment-queue
    depends_on:
      - elasticsearch
    networks:
      - app-network

volumes:
  postgres_data:
  elasticsearch_data:

networks:
  app-network:
    driver: bridge