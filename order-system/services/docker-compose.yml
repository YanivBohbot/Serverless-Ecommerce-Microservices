version: '3.8'

services:
  postgres-db:
    image: postgres:15
    container_name: order_service_db
    ports:
      - "5444:5432"
    environment:
      POSTGRES_USER: admin_yaniv
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: orders_final_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  order-service:
    build: ./order-service
    container_name: order_service_app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      # חשוב: כאן אנחנו משתמשים בשם של ה-service בתוך הרשת של דוקר
      - DATABASE_URL=postgres://admin_yaniv:password123@postgres-db:5432/orders_final_db
    depends_on:
      - postgres-db

  inventory-service:
    build: ./inventory-service # וודא שבתוך התיקייה הזו יש קובץ בשם Dockerfile
    container_name: inventory_service_app
    ports:
      - "3002:3002"
    env_file:
      - ./inventory-service/.env
    environment:
      - PORT=3002

  
volumes:
  postgres_data: